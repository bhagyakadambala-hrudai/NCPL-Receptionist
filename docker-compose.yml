version: "3.9"

services:
  receptionist:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend/audio:/app/audio
      - ./backend/ncpl_receptionist.db:/app/ncpl_receptionist.db
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
